<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Search fresher, graduate, junior and entry-level jobs in Hyderabad.">
<title>Hyderabad Entry-Level Jobs</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#667085;--line:#e5e7eb;--accent:#2559d6}
*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:42px 20px 28px;background:white;border-bottom:1px solid var(--line)}.wrap{max-width:1050px;margin:auto}
h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.04em}p{margin:0;color:var(--muted)}
main{padding:24px 20px 60px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:18px}
input,select{width:100%;padding:12px 13px;border:1px solid #d0d5dd;border-radius:10px;background:white;color:var(--ink);font:inherit}
.summary{margin:8px 0 16px;font-size:.92rem}.jobs{display:grid;gap:12px}.job{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}
.job h2{margin:0 0 5px;font-size:1.15rem}.company{font-weight:650;margin-bottom:6px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.tag{border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:#475467;font-size:.82rem}.description{color:#475467;margin:10px 0 14px;overflow-wrap:anywhere}
a{color:var(--accent);font-weight:650;text-decoration:none}a:hover{text-decoration:underline}.empty{background:white;border:1px dashed #cbd5e1;border-radius:14px;padding:28px;color:var(--muted)}
footer{margin-top:22px;font-size:.82rem;color:var(--muted)}@media(max-width:650px){.filters{grid-template-columns:1fr}header{padding-top:30px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Hyderabad Entry-Level Jobs</h1><p>Find fresher, graduate, junior, trainee and 0–2 year jobs in Hyderabad. Verify every vacancy on the employer website before applying.</p></div></header>
<main class="wrap">
<section class="filters" aria-label="Job search filters">
<input id="q" type="search" placeholder="Role, skill, company or keyword" aria-label="Search jobs">
<select id="mode" aria-label="Work mode"><option value="">All work modes</option><option value="onsite">Onsite</option><option value="hybrid">Hybrid</option><option value="remote">Remote</option></select>
<input id="location" type="search" placeholder="Location (e.g. Hyderabad)" aria-label="Location">
</section>
<div class="summary" id="summary" role="status">Loading job index…</div>
<section class="jobs" id="jobs"></section><footer id="updated"></footer>
</main>
<script>
const q=document.querySelector("#q"), mode=document.querySelector("#mode"), locationInput=document.querySelector("#location");
const jobsEl=document.querySelector("#jobs"), summary=document.querySelector("#summary");
let jobs=[];
function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function render(){
 const term=q.value.trim().toLowerCase(), place=locationInput.value.trim().toLowerCase(), selectedMode=mode.value;
 const filtered=jobs.filter(job=>{
  const searchable=[job.title,job.company,job.location,job.description,job.source_name].join(" ").toLowerCase();
  return (!term||searchable.includes(term))&&(!place||String(job.location||"").toLowerCase().includes(place))&&(!selectedMode||job.work_mode===selectedMode);
 });
 jobsEl.replaceChildren();summary.textContent=filtered.length+" result"+(filtered.length===1?"":"s")+" · "+jobs.length+" indexed";
 if(!filtered.length){jobsEl.append(node("div","empty",jobs.length?"No jobs match those filters. Try a broader keyword or location.":"The index is empty. Run the private crawler workflow to refresh the jobs index."));return}
 for(const job of filtered){
  const card=node("article","job");card.append(node("h2","",job.title||"Untitled role"));card.append(node("div","company",job.company||"Company not specified"));
  const meta=node("div","meta");
  [job.location||"Location not specified",job.work_mode||"work mode unknown",job.published_at?"Posted "+job.published_at:"date not supplied",job.link_status==="reachable"?"Link reachable · vacancy unverified":job.link_status==="unreachable"?"Link returned an error":"Link status not confirmed",job.status==="reachable_unverified"?"Vacancy unverified":""].filter(Boolean).forEach(label=>meta.append(node("span","tag",label)));
  card.append(meta);
  if(job.description)card.append(node("p","description",job.description.slice(0,420)+(job.description.length>420?"…":"")));
  const link=node("a","","View original listing / apply");link.href=job.application_url||job.source_url||"#";link.target="_blank";link.rel="noopener noreferrer";card.append(link);jobsEl.append(card);
 }
}
q.addEventListener("input",render);mode.addEventListener("change",render);locationInput.addEventListener("input",render);
fetch("./jobs.json",{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("index unavailable");return response.json()})
.then(data=>{jobs=Array.isArray(data.jobs)?data.jobs:[];render();document.querySelector("#updated").textContent=data.generated_at?"Index last generated: "+data.generated_at:"Index has not been generated yet."})
.catch(()=>{summary.textContent="Could not load the job index.";jobsEl.append(node("div","empty","Serve this folder through a web server and ensure jobs.json exists."))});
</script>
</body>
</html>
